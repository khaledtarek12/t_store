pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    id "com.android.library" version "8.11.1" apply false
    // START: FlutterFire Configuration
    id "com.google.gms.google-services" version "4.4.2" apply false
    // END: FlutterFire Configuration
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

include ":app"

// Flutter plugins often pin their own AGP on the buildscript classpath.
// Align them to this project's AGP so Gradle does not download mismatched
// older artifacts (which is what triggered the TLS handshake failures).
gradle.beforeProject { project ->
    project.buildscript.configurations.classpath.resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "com.android.tools.build" && details.requested.name == "gradle") {
            details.useVersion "8.11.1"
        }
    }
}
